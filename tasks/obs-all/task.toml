id = "obs-all"
title = "obs-all: the whole observer from one specification"
class = "additive"
lang = "python"
spec = """`obs` is a small observer that reads systemd journal exports and reports on them. This repository holds the template and one test file, `test_counts_tz.py`, which is part of the requirements below and is currently red. Build the whole program.

The requirements are given in six parts, written as the six tickets that would have built it one at a time. Only the finished tree is judged, and you choose how to get there: you may write the final layout directly, and you never have to reproduce an intermediate state. Where a later part changes what an earlier part asked for, the later part wins, and the earlier part's wording about where a file sits or which files may be added describes that part's moment, not the finished tree. Two things are settled by the later parts and are repeated here so they are not missed: the finished tree keeps its modules in the package `observer/` as Part 3 describes, and every function of `observer/journal.py`, `observer/counts.py` and `observer/report.py` carries the annotations Part 6 specifies.

`.factory/verify.sh` must be green, and `python3 -m unittest test_journal test_counts test_counts_tz test_report` must be green. Standard library only. Do not edit `.factory/verify.sh`.

## Part 1 (obs-01-parse)

This repository is empty apart from the template. It will grow into `obs`, a small observer that reads systemd journal exports and reports on them. This first step is the parser.

Create `journal.py` (stdlib only) with two functions, and `test_journal.py` (unittest, at least four test methods) covering them:

`parse(text)` parses the text form of the journal export format and returns a list of records in order of appearance. The format: a record is a run of `KEY=VALUE` lines ended by an empty line or by the end of the text; blank lines before the first record, between records and after the last one are ignored, however many. A key matches `[A-Z0-9_]+` (leading underscores are part of the key). The first `=` of a line splits key and value, so `MESSAGE=x=y` has the value `x=y`, and `KEY=` has the value `""`. A `\r` right before the `\n` is dropped (CRLF input parses like LF input). Every record must carry `__REALTIME_TIMESTAMP` (decimal digits: microseconds since the epoch) and `MESSAGE`. Each record is returned as a `dict` whose keys are the field names exactly as in the input and whose values are the field strings, except `__REALTIME_TIMESTAMP`, which is converted to `int`. A key repeated inside one record keeps the last value. `parse("")` and text made of blank lines return `[]`.

`parse` raises `ValueError` (the message is free) for: a non-empty line without `=` or whose key does not match `[A-Z0-9_]+` (so `message=a` is an error); a record missing `__REALTIME_TIMESTAMP` or `MESSAGE`; a `__REALTIME_TIMESTAMP` that is not all decimal digits. No other exception type for bad input.

`load(path)` opens the file at `path` as UTF-8 text and returns `parse` of its contents.

No other new files, no dependencies. `.factory/verify.sh` (compiles every `.py` at the root and runs every `test_*.py`) must be green.

## Part 2 (obs-02-count)

`journal.py` parses journal exports into records (dicts of field name to string, `__REALTIME_TIMESTAMP` as an int of microseconds since the epoch). Add the first report and the command line. Three new files, stdlib only:

`counts.py` with three functions. `day_of(ts_us)` returns the UTC calendar day of a timestamp in microseconds as `"YYYY-MM-DD"` (UTC, never the local timezone). `by_unit(records)` returns a list of `(unit, count)` tuples, one per distinct `_SYSTEMD_UNIT` value, where a record without `_SYSTEMD_UNIT` counts under the unit name `"-"`; the list is sorted by count descending, ties by unit name ascending (plain string order). `by_day(records)` returns a list of `(day, count)` tuples, one per distinct `day_of(record["__REALTIME_TIMESTAMP"])`, sorted by day ascending. Both return `[]` for no records.

`obs.py`, the command line, run as `python3 obs.py count FILE`. It loads FILE with `journal.load` and prints, to stdout, one line `<count>\t<unit>` per entry of `by_unit` in that order, then one empty line, then one line `<count>\t<day>` per entry of `by_day` in that order; exit status 0. If the file holds no records it prints nothing and exits 0. Errors: any other argument shape (no subcommand, a subcommand other than `count`, a missing or extra argument) prints `usage: obs.py count FILE` to stderr and exits 2; a file that cannot be opened or read prints `error: ` followed by a description to stderr and exits 2; a file `parse` rejects (ValueError) prints `error: ` followed by a description to stderr and exits 1. Nothing goes to stdout on an error.

`test_counts.py` (unittest, at least three test methods) covering the sorting rules, the UTC day, and the command line's output and exit statuses.

Do not modify `journal.py` or `test_journal.py`. No other new files. `.factory/verify.sh` must be green.

## Part 3 (obs-03-package)

The library modules `journal.py` and `counts.py` sit at the repository root next to the command line `obs.py` and the tests. Move them into a package so the root holds only the entry point and the tests.

Create the package `observer/` with an empty `observer/__init__.py`, `observer/journal.py` holding exactly the current contents of `journal.py`, and `observer/counts.py` holding exactly the current contents of `counts.py` (the code moves unchanged: same functions, same bodies, same docstrings, no reformatting). Delete `journal.py` and `counts.py` from the root. Update `obs.py`, `test_journal.py` and `test_counts.py` so every import of the moved modules goes through the package (`observer.journal`, `observer.counts`), changing nothing else in them.

No behaviour change: `python3 obs.py count FILE` prints exactly what it prints today for every FILE, with the same exit statuses, and `python3 -m unittest test_journal test_counts` stays green. After the change the root holds exactly `obs.py`, `test_journal.py` and `test_counts.py` as `.py` files and `observer/` holds exactly `__init__.py`, `journal.py` and `counts.py`. No other new or changed files. `.factory/verify.sh` must be green.

## Part 4 (obs-04-tzfix)

A user reported that `python3 obs.py count FILE` gives different per-day counts on two hosts fed the same export (a contributor's rewrite of `observer/counts.py`, now in the tree, uses the host's local time). The regression test `test_counts_tz.py` (new, do not edit it) reproduces it and fails: it runs `observer.counts` under several `TZ` settings and expects the same UTC days every time.

Fix `observer/counts.py` so the whole suite passes: `python3 -m unittest test_journal test_counts test_counts_tz` green, and `.factory/verify.sh` green. The docstrings in `observer/counts.py` are the contract (`day_of` returns the UTC calendar day; `by_unit` and `by_day` keep their orderings). Change nothing else: no other file edited, no file added or removed, and the output of `python3 obs.py count FILE` for any export is unchanged apart from days that the bug placed wrongly.

## Part 5 (obs-05-report)

The package `observer` has `journal` (records: dicts of field name to string, `__REALTIME_TIMESTAMP` as an int of microseconds since the epoch) and `counts` (`day_of`, `by_unit`, `by_day`, `NO_UNIT = "-"`). Add the weekly report. Three new files, stdlib only:

`observer/report.py` with `week_days(week)` and `weekly(records, week)`. `week_days` takes an ISO week written exactly as `YYYY-Www` (four ASCII digits `0-9`, a hyphen, an upper-case W, two ASCII digits, nothing before or after, no trailing newline) and returns the seven UTC calendar days of that week as `"YYYY-MM-DD"` strings, Monday first; it raises `ValueError` for any other string and for a week number the year does not have. `weekly` returns the report for the records whose `day_of` timestamp falls in that week, as one string, these lines joined with `\n` and ending with `\n`:

```
# Week YYYY-Www
(empty line)
## Units
(empty line)
| unit | count |
|---|---|
| <unit> | <count> |          one row per entry of by_unit(records of the week), in that order
(empty line)
## Days
(empty line)
- YYYY-MM-DD: <count>        one line per day of the week, Monday first, 0 for a day without records
(empty line)
## Errors
(empty line)
- <stamp> <unit>: <MESSAGE>   one line per error record, at most 20
- and <n> more                only when there are more than 20 error records, n = the rest
```

An error record is one whose `PRIORITY` field is present, all decimal digits, and at most 3. Error lines are ordered by timestamp ascending, ties by unit then by message; `<stamp>` is the record's timestamp as UTC `YYYY-MM-DDTHH:MM:SSZ` (microseconds dropped); `<unit>` is `_SYSTEMD_UNIT` or `-` without one. With no error records the section holds the single line `- none`. With no records at all the Units table has only its two header rows and every day shows 0.

`obsreport.py` at the root, run as `python3 obsreport.py FILE YYYY-Www`: writes `weekly(journal.load(FILE), week)` to stdout and exits 0. Any other argument count prints `usage: obsreport.py FILE YYYY-Www` to stderr and exits 2; a week `week_days` rejects prints `error: ` and a description to stderr and exits 2 (checked before the file is read); a file that cannot be opened or read prints `error: ` and a description to stderr and exits 2; a file `journal.parse` rejects prints `error: ` and a description to stderr and exits 1. Nothing on stdout on an error.

`test_report.py` (unittest, at least three test methods) covering `week_days`, the report text, and the command line.

Do not modify any existing file. No other new files. `.factory/verify.sh` must be green.

## Part 6 (obs-06-typehints)

Add type hints to the three library modules `observer/journal.py`, `observer/counts.py` and `observer/report.py`: every function defined at module level in them (public and `_private` alike) gets an annotation on every parameter and on its return value, written with the builtin generics (`list[...]`, `dict[...]`, `tuple[...]`, `X | Y`), with no `typing` import and no `from __future__ import annotations`. A journal record is `dict[str, str | int]`; a timestamp is `int`; a day, a week and a unit are `str`. Exactly these signatures for the public functions: `parse(text: str) -> list[dict[str, str | int]]`, `load(path: str) -> list[dict[str, str | int]]`, `day_of(ts_us: int) -> str`, `by_unit(records: list[dict[str, str | int]]) -> list[tuple[str, int]]`, `by_day(records: list[dict[str, str | int]]) -> list[tuple[str, int]]`, `week_days(week: str) -> list[str]`, `weekly(records: list[dict[str, str | int]], week: str) -> str`; a `_private` helper gets the annotations its use implies.

Nothing else changes: function bodies, names, default values, docstrings, module-level constants and imports stay exactly as they are (a lambda or a nested function gets no annotation), `python3 obs.py count FILE` and `python3 obsreport.py FILE YYYY-Www` print exactly what they print today with the same exit statuses, every test stays green, and no file other than the three named is added, removed or changed. `.factory/verify.sh` must be green."""
