id = "obs-04-tzfix"
title = "obs-04-tzfix: the day counts depend on the host's timezone; make the regression test pass"
class = "repair"
lang = "python"
after = "obs-03-package"
may_edit = ["observer/counts.py"]
spec = """A user reported that `python3 obs.py count FILE` gives different per-day counts on two hosts fed the same export (a contributor's rewrite of `observer/counts.py`, now in the tree, uses the host's local time). The regression test `test_counts_tz.py` (new, do not edit it) reproduces it and fails: it runs `observer.counts` under several `TZ` settings and expects the same UTC days every time.

Fix `observer/counts.py` so the whole suite passes: `python3 -m unittest test_journal test_counts test_counts_tz` green, and `.dark/verify.sh` green. The docstrings in `observer/counts.py` are the contract (`day_of` returns the UTC calendar day; `by_unit` and `by_day` keep their orderings). Change nothing else: no other file edited, no file added or removed, and the output of `python3 obs.py count FILE` for any export is unchanged apart from days that the bug placed wrongly.

Scope: this ticket sits on work earlier tickets delivered. A file an earlier ticket delivered is changed only where this specification names it; every other file in the tree stays byte for byte as it is, and a change to one is a failure of this ticket even if the tests still pass."""
