id = "obs-06-typehints"
title = "obs-06-typehints: annotate the package's functions, no behaviour change"
class = "mechanical"
lang = "python"
after = "obs-05-report"
may_edit = ["observer/journal.py", "observer/counts.py", "observer/report.py"]
spec = """Add type hints to the three library modules `observer/journal.py`, `observer/counts.py` and `observer/report.py`: every function defined at module level in them (public and `_private` alike) gets an annotation on every parameter and on its return value, written with the builtin generics (`list[...]`, `dict[...]`, `tuple[...]`, `X | Y`), with no `typing` import and no `from __future__ import annotations`. A journal record is `dict[str, str | int]`; a timestamp is `int`; a day, a week and a unit are `str`. Exactly these signatures for the public functions: `parse(text: str) -> list[dict[str, str | int]]`, `load(path: str) -> list[dict[str, str | int]]`, `day_of(ts_us: int) -> str`, `by_unit(records: list[dict[str, str | int]]) -> list[tuple[str, int]]`, `by_day(records: list[dict[str, str | int]]) -> list[tuple[str, int]]`, `week_days(week: str) -> list[str]`, `weekly(records: list[dict[str, str | int]], week: str) -> str`; a `_private` helper gets the annotations its use implies.

Nothing else changes: function bodies, names, default values, docstrings, module-level constants and imports stay exactly as they are (a lambda or a nested function gets no annotation), `python3 obs.py count FILE` and `python3 obsreport.py FILE YYYY-Www` print exactly what they print today with the same exit statuses, every test stays green, and no file other than the three named is added, removed or changed. `.factory/verify.sh` must be green.

Scope: this ticket sits on work earlier tickets delivered. A file an earlier ticket delivered is changed only where this specification names it; every other file in the tree stays byte for byte as it is, and a change to one is a failure of this ticket even if the tests still pass."""
